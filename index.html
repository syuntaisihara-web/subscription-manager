<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="サブスク管理" />
  <title>サブスク管理</title>
  <link rel="manifest" href="manifest.json?v=020" />
  <link rel="icon" type="image/png" href="app_icon.png?v=020" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=020" />
  <link rel="stylesheet" href="styles.css?v=020" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="app_icon.png?v=017" alt="サブスク管理" /></div>
        <div>
          <div class="brand-title">サブスク管理</div>
          <div class="brand-sub">Subscription Manager</div>
        </div>
      </div>
      <nav id="sideNav" class="nav-list">
        <button class="nav-item active" data-view="dashboard">ダッシュボード</button>
        <button class="nav-item" data-view="subscriptions">サブスク</button>
        <button class="nav-item" data-view="calendar">カレンダー</button>
        <button class="nav-item" data-view="history">支払履歴</button>
        <button class="nav-item" data-view="settings">設定</button>
      </nav>
      <div class="sidebar-footer">Ver. 0.2.0</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">ダッシュボード</h1>
          <p id="pageSubtitle">固定費の状況をひと目で確認できます。</p>
        </div>
        <button id="addSubscriptionBtn" class="primary-btn">＋ サブスクを追加</button>
      </header>

      <section id="dashboard" class="view active">
        <div class="stats-grid">
          <article class="stat-card"><span>月間固定費</span><strong id="monthlyTotal">¥0</strong><small>月額換算</small></article>
          <article class="stat-card"><span>年間固定費</span><strong id="yearlyTotal">¥0</strong><small>現在の契約ベース</small></article>
          <article class="stat-card"><span>契約サービス</span><strong id="activeCount">0件</strong><small>契約中</small></article>
          <article class="stat-card"><span>今月の支払予定</span><strong id="thisMonthTotal">¥0</strong><small id="thisMonthLabel"></small></article>
        </div>

        <div class="two-column">
          <article class="panel">
            <div class="panel-head"><div><h2>今後の支払い</h2><p>次回支払日が近い順</p></div></div>
            <div id="upcomingList" class="list"></div>
          </article>
          <article class="panel">
            <div class="panel-head"><div><h2>カテゴリー別</h2><p>月額換算の構成比</p></div></div>
            <div class="donut-wrap"><div id="categoryDonut" class="donut"></div><div id="categoryLegend" class="legend"></div></div>
          </article>
        </div>

        <article class="panel">
          <div class="panel-head"><div><h2>契約中のサービス</h2><p>よく確認する情報を一覧表示</p></div><button class="text-btn" data-jump="subscriptions">すべて見る</button></div>
          <div id="dashboardSubscriptions" class="table-wrap"></div>
        </article>
      </section>

      <section id="subscriptions" class="view">
        <div class="toolbar">
          <input id="searchInput" class="input" type="search" placeholder="サービス名を検索" />
          <select id="statusFilter" class="input"><option value="all">すべての状態</option><option value="active">契約中</option><option value="planned">解約予定</option><option value="inactive">停止中</option></select>
          <select id="categoryFilter" class="input"><option value="all">すべてのカテゴリー</option></select>
          <select id="sortSelect" class="input"><option value="next">次回支払日順</option><option value="priceDesc">金額が高い順</option><option value="name">サービス名順</option></select>
        </div>
        <article class="panel"><div id="subscriptionTable" class="table-wrap"></div></article>
      </section>

      <section id="calendar" class="view">
        <article class="panel">
          <div class="calendar-head">
            <button id="prevMonth" class="icon-btn">‹</button>
            <h2 id="calendarTitle"></h2>
            <button id="nextMonth" class="icon-btn">›</button>
          </div>
          <div class="calendar-week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </article>
      </section>

      <section id="history" class="view">
        <article class="panel">
          <div class="panel-head"><div><h2>支払履歴</h2><p>「支払済みにする」で履歴に追加されます。</p></div><button id="exportCsvBtn" class="secondary-btn">CSV出力</button></div>
          <div id="historyTable" class="table-wrap"></div>
        </article>
      </section>

      <section id="settings" class="view">
        <div class="settings-grid">
          <article class="panel">
            <div class="panel-head"><div><h2>表示設定</h2><p>この端末に保存されます。</p></div></div>
            <label class="field"><span>テーマ</span><select id="themeSelect" class="input"><option value="light">ライト</option><option value="dark">ダーク</option></select></label>
            <label class="field"><span>基本通貨</span><select id="currencySelect" class="input"><option value="JPY">JPY（円）</option><option value="USD">USD（米ドル）</option><option value="EUR">EUR（ユーロ）</option></select></label>
          </article>
          <article class="panel">
            <div class="panel-head"><div><h2>データ管理</h2><p>バックアップと復元</p></div></div>
            <div class="action-stack">
              <button id="backupBtn" class="secondary-btn">JSONバックアップ</button>
              <label class="secondary-btn file-btn">JSONから復元<input id="restoreInput" type="file" accept="application/json" hidden></label>
              <button id="resetBtn" class="danger-btn">すべてのデータを削除</button>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <nav class="mobile-nav">
    <button class="mobile-nav-item active" data-view="dashboard">ホーム</button>
    <button class="mobile-nav-item" data-view="subscriptions">サブスク</button>
    <button class="mobile-nav-item" data-view="calendar">予定</button>
    <button class="mobile-nav-item" data-view="settings">設定</button>
  </nav>

  <dialog id="subscriptionDialog" class="dialog">
    <form id="subscriptionForm" method="dialog">
      <div class="dialog-head"><div><h2 id="dialogTitle">サブスクを追加</h2><p>契約情報を入力してください。</p></div><button type="button" id="closeDialogBtn" class="icon-btn">×</button></div>
      <input type="hidden" id="subscriptionId" />
      <div class="form-grid">
        <label class="field full"><span>サービス名 *</span><input id="nameInput" class="input" required /></label>
        <label class="field"><span>カテゴリー</span><input id="categoryInput" class="input" list="categoryList" placeholder="例：動画" /><datalist id="categoryList"></datalist></label>
        <label class="field"><span>支払方法</span><input id="paymentMethodInput" class="input" list="paymentMethodList" placeholder="例：楽天カード" /><datalist id="paymentMethodList"></datalist></label>
        <label class="field"><span>料金 *</span><input id="priceInput" class="input" type="number" min="0" step="1" required /></label>
        <label class="field"><span>通貨</span><select id="itemCurrencyInput" class="input"><option>JPY</option><option>USD</option><option>EUR</option></select></label>
        <label class="field"><span>支払周期</span><select id="cycleInput" class="input"><option value="monthly">毎月</option><option value="yearly">毎年</option><option value="weekly">毎週</option><option value="custom">カスタム</option></select></label>
        <label class="field custom-cycle hidden"><span>カスタム間隔</span><input id="customIntervalInput" class="input" type="number" min="1" value="2" /></label>
        <label class="field custom-cycle hidden"><span>単位</span><select id="customUnitInput" class="input"><option value="months">か月</option><option value="days">日</option><option value="years">年</option></select></label>
        <label class="field"><span>契約開始日</span><input id="startDateInput" class="input" type="date" /></label>
        <label class="field"><span>次回支払日 *</span><input id="nextDateInput" class="input" type="date" required /></label>
        <label class="field"><span>状態</span><select id="statusInput" class="input"><option value="active">契約中</option><option value="planned">解約予定</option><option value="inactive">停止中</option></select></label>
        <label class="field full"><span>メモ</span><textarea id="memoInput" class="input" rows="3" placeholder="任意"></textarea></label>
      </div>
      <div class="dialog-actions"><button type="button" id="cancelDialogBtn" class="secondary-btn">キャンセル</button><button type="submit" class="primary-btn">保存</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script src="app.js?v=020"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=020').catch(() => {}));
    }
  </script>
</body>
</html>
